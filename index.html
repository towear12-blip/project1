<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장비 관리 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 부드러운 애니메이션 추가 */
        #settingsPanel { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <div class="mb-8">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-4xl font-bold text-slate-800">장비 관리 대시보드</h1>
                <div class="flex gap-2">
                    <button onclick="showSettings()" class="px-4 py-2 bg-slate-600 text-white rounded-lg hover:bg-slate-700 shadow-md transition-all">
                        설정
                    </button>
                    <button onclick="refreshData()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-md transition-all">
                        새로고침
                    </button>
                </div>
            </div>
            <p id="lastUpdate" class="text-sm text-slate-500">마지막 업데이트: 데이터 없음</p>
        </div>

        <div id="settingsPanel" class="hidden mb-6 bg-white rounded-xl shadow-2xl p-6 border-2 border-blue-400">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-800">⚙️ 시스템 설정</h2>
                <button onclick="showSettings()" class="text-slate-400 hover:text-slate-600">✕ 닫기</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Google Apps Script API URL</label>
                    <input type="text" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"
                           class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 outline-none">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg">
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="autoRefresh" class="w-5 h-5 cursor-pointer">
                        <label for="autoRefresh" class="text-sm font-bold text-slate-700 cursor-pointer">자동 새로고침 사용</label>
                    </div>
                    <div id="intervalSettings" class="flex items-center gap-2 hidden">
                        <label class="text-sm font-medium text-slate-600">간격(초):</label>
                        <input type="number" id="refreshInterval" value="30" min="10" 
                               class="w-24 px-3 py-1 border rounded-md">
                    </div>
                </div>
                
                <button onclick="saveSettings()" class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold text-lg shadow-lg">
                    설정 내용 저장 및 적용
                </button>
            </div>
        </div>

        <div id="errorMessage" class="mb-6 p-4 bg-red-100 border-l-4 border-red-500 rounded text-red-700 hidden"></div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8" id="statusGrid">
            </div>

        <div class="mb-6 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-slate-700 font-bold mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-blue-500 rounded-full"></span> 배터리 용량별(Ah) 현황
            </h3>
            <div id="batterySummary" class="flex flex-wrap gap-3 text-sm">
                </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
            <div class="px-6 py-4 bg-slate-800 flex justify-between items-center">
                <h2 class="text-white font-bold text-lg">전체 장비 현황 (<span id="totalCount">0</span>대)</h2>
            </div>
            <div id="loadingMessage" class="p-20 text-center text-slate-400">
                <p>데이터를 불러오려면 '설정'에서 API URL을 입력하세요.</p>
            </div>
            <div id="tableContainer" class="overflow-x-auto hidden">
                <table class="w-full">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                        <tr>
                            <th class="px-6 py-3 text-left">Serial NO</th>
                            <th class="px-6 py-3 text-left">배터리 용량</th>
                            <th class="px-6 py-3 text-left">현재 상태</th>
                            <th class="px-6 py-3 text-left">최종 보고자</th>
                            <th class="px-6 py-3 text-left">업데이트일</th>
                            <th class="px-6 py-3 text-left">세부 정보</th>
                            <th class="px-6 py-3 text-center">관리 상태 (E열)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let refreshTimer = null;

        // 1. 설정 패널 토글 함수 (확실하게 작동하도록 수정)
        function showSettings() {
            const panel = document.getElementById('settingsPanel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        // 2. 설정 로드
        function loadSettings() {
            const url = localStorage.getItem('equipmentApiUrl');
            const auto = localStorage.getItem('equipmentAutoRefresh') === 'true';
            const interval = localStorage.getItem('equipmentRefreshInterval') || '30';

            if (url) {
                document.getElementById('apiUrl').value = url;
                refreshData(); // 저장된 URL이 있으면 즉시 새로고침
            }
            document.getElementById('autoRefresh').checked = auto;
            document.getElementById('refreshInterval').value = interval;
            
            if (auto) {
                document.getElementById('intervalSettings').classList.remove('hidden');
                startAutoRefresh();
            }
        }

        // 3. 설정 저장
        function saveSettings() {
            const url = document.getElementById('apiUrl').value.trim();
            const auto = document.getElementById('autoRefresh').checked;
            const interval = document.getElementById('refreshInterval').value;

            if (!url) {
                alert("⚠️ API URL을 입력해 주세요.");
                return;
            }

            localStorage.setItem('equipmentApiUrl', url);
            localStorage.setItem('equipmentAutoRefresh', auto);
            localStorage.setItem('equipmentRefreshInterval', interval);

            alert("✅ 설정이 저장되었습니다.");
            showSettings(); // 패널 닫기

            if (auto) startAutoRefresh();
            else stopAutoRefresh();

            refreshData();
        }

        // 4. 데이터 새로고침 및 렌더링 (E열 관리상태 포함)
        async function refreshData() {
            const url = localStorage.getItem('equipmentApiUrl');
            if (!url) return;

            hideError();
            try {
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    renderDashboard(result.data);
                    document.getElementById('lastUpdate').innerText = `마지막 업데이트: ${new Date().toLocaleString()}`;
                }
            } catch (e) {
                showError("데이터 로딩 실패: URL을 확인하거나 CORS 설정을 확인하세요.");
            }
        }

        function renderDashboard(data) {
            document.getElementById('loadingMessage').classList.add('hidden');
            document.getElementById('tableContainer').classList.remove('hidden');

            const tbody = document.getElementById('tableBody');
            const batteryDiv = document.getElementById('batterySummary');
            tbody.innerHTML = '';
            batteryDiv.innerHTML = '';

            let batteryMap = {};

            data.forEach(item => {
                // Ah 추출 로직 (| 뒤의 문자열에서 숫자Ah 찾기)
                const ahMatch = (item.batteryType || "").match(/\d+Ah/i);
                const ah = ahMatch ? ahMatch[0].toUpperCase() : "기타";
                batteryMap[ah] = (batteryMap[ah] || 0) + 1;

                // 테이블 행 생성
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-slate-700">${item.serialNumber || '-'}</td>
                    <td class="px-6 py-4 text-slate-500 text-sm">${item.batteryType || '-'}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded-full bg-blue-50 text-blue-700 text-xs border border-blue-200 font-medium">${item.status}</span></td>
                    <td class="px-6 py-4 text-sm">${item.reporter || '-'}</td>
                    <td class="px-6 py-4 text-sm text-slate-400">${item.timestamp || '-'}</td>
                    <td class="px-6 py-4 text-sm">${item.details || '-'}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="px-3 py-1 bg-slate-800 text-white rounded text-xs font-bold ring-2 ring-slate-100">
                            ${item.managementStatus || '미정'}
                        </span>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // 배터리 요약 UI 생성
            Object.keys(batteryMap).sort().forEach(key => {
                batteryDiv.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg">
                        <span class="font-bold text-blue-600">${key}:</span> ${batteryMap[key]}대
                    </div>
                `;
            });

            document.getElementById('totalCount').innerText = data.length;
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            const sec = document.getElementById('refreshInterval').value || 30;
            refreshTimer = setInterval(refreshData, sec * 1000);
        }

        function stopAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
        }

        function showError(m) {
            const err = document.getElementById('errorMessage');
            err.innerText = m;
            err.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        // 체크박스 변경 시 설정창 즉시 업데이트
        document.getElementById('autoRefresh').addEventListener('change', (e) => {
            document.getElementById('intervalSettings').classList.toggle('hidden', !e.target.checked);
        });

        window.onload = loadSettings;
    </script>
</body>
</html>
